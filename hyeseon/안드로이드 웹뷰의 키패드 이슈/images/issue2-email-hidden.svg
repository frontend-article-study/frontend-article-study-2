<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="900" height="680" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">이슈 2 — 이메일 input이 키패드에 가려지는 문제 (A 제휴처 웹뷰)</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#6b7280">visualViewport도 dvh도 keyboard를 반영하지 않는 웹뷰에서 재현</text>

  <!-- ===== LEFT: 버그 ===== -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="260" height="480" rx="36" fill="#111827"/>
    <clipPath id="clip-l2"><rect x="10" y="14" width="240" height="452" rx="24"/></clipPath>
    <g clip-path="url(#clip-l2)">
      <rect x="10" y="14" width="240" height="452" fill="#ffffff"/>
      <rect x="10" y="14" width="240" height="26" fill="#ffffff"/>
      <circle cx="130" cy="27" r="4" fill="#374151"/>
      <rect x="10" y="40" width="240" height="90" fill="#eef2f7"/>
      <rect x="26" y="56" width="140" height="10" rx="5" fill="#c7d2e0"/>
      <rect x="10" y="130" width="240" height="40" fill="#000000" opacity="0.35"/>
      <!-- modal (fixed bottom sheet, does not expand) -->
      <rect x="10" y="170" width="240" height="296" rx="20" fill="#f4f5f7" stroke="#e5e7eb"/>
      <text x="30" y="200" font-size="12" font-weight="600" fill="#111827">비밀번호와 이메일을 입력해 주세요</text>
      <text x="30" y="224" font-size="10" fill="#6b7280">비밀번호</text>
      <rect x="30" y="230" width="200" height="36" rx="10" fill="#ffffff" stroke="#d1d5db"/>
      <text x="42" y="253" font-size="14" letter-spacing="3" fill="#374151">•••••</text>
      <text x="30" y="282" font-size="10" fill="#6b7280">이메일 주소</text>
      <rect x="30" y="288" width="200" height="36" rx="10" fill="#ffffff" stroke="#d1d5db"/>
      <text x="42" y="311" font-size="12" fill="#9ca3af">이메일 주소 입력</text>
      <!-- keyboard on top, overlaps email field -->
      <rect x="10" y="262" width="240" height="204" fill="#cbd5e1"/>
      <g fill="#94a3b8">
        <rect x="18" y="276" width="22" height="22" rx="5"/><rect x="46" y="276" width="22" height="22" rx="5"/><rect x="74" y="276" width="22" height="22" rx="5"/><rect x="102" y="276" width="22" height="22" rx="5"/><rect x="130" y="276" width="22" height="22" rx="5"/><rect x="158" y="276" width="22" height="22" rx="5"/><rect x="186" y="276" width="22" height="22" rx="5"/><rect x="214" y="276" width="22" height="22" rx="5"/>
        <rect x="18" y="304" width="22" height="22" rx="5"/><rect x="46" y="304" width="22" height="22" rx="5"/><rect x="74" y="304" width="22" height="22" rx="5"/><rect x="102" y="304" width="22" height="22" rx="5"/><rect x="130" y="304" width="22" height="22" rx="5"/><rect x="158" y="304" width="22" height="22" rx="5"/><rect x="186" y="304" width="22" height="22" rx="5"/><rect x="214" y="304" width="22" height="22" rx="5"/>
        <rect x="18" y="332" width="22" height="22" rx="5"/><rect x="46" y="332" width="22" height="22" rx="5"/><rect x="74" y="332" width="22" height="22" rx="5"/><rect x="102" y="332" width="22" height="22" rx="5"/><rect x="130" y="332" width="22" height="22" rx="5"/><rect x="158" y="332" width="22" height="22" rx="5"/><rect x="186" y="332" width="22" height="22" rx="5"/><rect x="214" y="332" width="22" height="22" rx="5"/>
        <rect x="18" y="360" width="106" height="22" rx="5"/><rect x="130" y="360" width="106" height="22" rx="5"/>
      </g>
    </g>
    <rect x="10" y="14" width="240" height="452" rx="24" fill="none" stroke="#e5e7eb"/>
    <!-- annotation pointing at hidden email field -->
    <rect x="26" y="284" width="208" height="40" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="130" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#ef4444">버그</text>
    <text x="130" y="530" text-anchor="middle" font-size="11" fill="#6b7280">이메일 input이 키패드 뒤로 완전히 가려짐</text>
    <text x="130" y="546" text-anchor="middle" font-size="11" fill="#6b7280">스크롤도 안 됨</text>
  </g>

  <!-- ===== RIGHT: 수정 후 ===== -->
  <g transform="translate(580,80)">
    <rect x="0" y="0" width="260" height="480" rx="36" fill="#111827"/>
    <clipPath id="clip-r2"><rect x="10" y="14" width="240" height="452" rx="24"/></clipPath>
    <g clip-path="url(#clip-r2)">
      <rect x="10" y="14" width="240" height="452" fill="#ffffff"/>
      <rect x="10" y="14" width="240" height="26" fill="#ffffff"/>
      <circle cx="130" cy="27" r="4" fill="#374151"/>
      <rect x="10" y="40" width="240" height="20" fill="#eef2f7"/>
      <rect x="10" y="60" width="240" height="10" fill="#000000" opacity="0.35"/>
      <rect x="10" y="70" width="240" height="396" rx="20" fill="#f4f5f7" stroke="#e5e7eb"/>
      <text x="30" y="100" font-size="12" font-weight="600" fill="#111827">비밀번호와 이메일을 입력해 주세요</text>
      <text x="30" y="124" font-size="10" fill="#6b7280">비밀번호</text>
      <rect x="30" y="130" width="200" height="36" rx="10" fill="#ffffff" stroke="#d1d5db"/>
      <text x="42" y="153" font-size="14" letter-spacing="3" fill="#374151">•••••</text>
      <text x="30" y="182" font-size="10" fill="#6b7280">이메일 주소</text>
      <rect x="30" y="188" width="200" height="36" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <text x="42" y="211" font-size="12" fill="#9ca3af">이메일 주소 입력</text>
      <!-- padding-bottom spacer -->
      <g opacity="0.55">
        <line x1="30" y1="234" x2="30" y2="262" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
        <line x1="230" y1="234" x2="230" y2="262" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>
      </g>
      <!-- keyboard, no longer overlapping email field -->
      <rect x="10" y="262" width="240" height="204" fill="#cbd5e1"/>
      <g fill="#94a3b8">
        <rect x="18" y="276" width="22" height="22" rx="5"/><rect x="46" y="276" width="22" height="22" rx="5"/><rect x="74" y="276" width="22" height="22" rx="5"/><rect x="102" y="276" width="22" height="22" rx="5"/><rect x="130" y="276" width="22" height="22" rx="5"/><rect x="158" y="276" width="22" height="22" rx="5"/><rect x="186" y="276" width="22" height="22" rx="5"/><rect x="214" y="276" width="22" height="22" rx="5"/>
        <rect x="18" y="304" width="22" height="22" rx="5"/><rect x="46" y="304" width="22" height="22" rx="5"/><rect x="74" y="304" width="22" height="22" rx="5"/><rect x="102" y="304" width="22" height="22" rx="5"/><rect x="130" y="304" width="22" height="22" rx="5"/><rect x="158" y="304" width="22" height="22" rx="5"/><rect x="186" y="304" width="22" height="22" rx="5"/><rect x="214" y="304" width="22" height="22" rx="5"/>
        <rect x="18" y="332" width="22" height="22" rx="5"/><rect x="46" y="332" width="22" height="22" rx="5"/><rect x="74" y="332" width="22" height="22" rx="5"/><rect x="102" y="332" width="22" height="22" rx="5"/><rect x="130" y="332" width="22" height="22" rx="5"/><rect x="158" y="332" width="22" height="22" rx="5"/><rect x="186" y="332" width="22" height="22" rx="5"/><rect x="214" y="332" width="22" height="22" rx="5"/>
        <rect x="18" y="360" width="106" height="22" rx="5"/><rect x="130" y="360" width="106" height="22" rx="5"/>
      </g>
    </g>
    <rect x="10" y="14" width="240" height="452" rx="24" fill="none" stroke="#e5e7eb"/>
    <text x="130" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">수정 후</text>
    <text x="130" y="530" text-anchor="middle" font-size="11" fill="#6b7280">모달 max-height 확장 + padding-bottom 으로</text>
    <text x="130" y="546" text-anchor="middle" font-size="11" fill="#6b7280">이메일 필드가 키패드 위에 노출됨</text>
  </g>

  <text x="450" y="656" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">⤷ 접근: 키패드 정확한 높이 추정을 포기하고, white 배경으로 화면 전체를 덮은 뒤 padding-bottom 여유로 오차를 흡수</text>
</svg>
