<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <rect width="1240" height="780" fill="#ffffff"/>
  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">AndroidManifest.xml — windowSoftInputMode 3가지 모드 비교</text>
  <text x="620" y="56" text-anchor="middle" font-size="12" fill="#6b7280">핵심 차이는 "WebView 크기가 실제로 줄어드는가" vs "WebView는 그대로인데 키보드가 위에 얹히는가" 입니다</text>

  <!-- legend -->
  <g transform="translate(360,68)">
    <rect x="0" y="0" width="16" height="16" fill="#2563eb"/>
    <text x="22" y="13" font-size="11" fill="#374151">실선 = WebView 영역 (겹침 없이 그 크기만큼만 사용)</text>
    <rect x="330" y="0" width="16" height="16" fill="#cbd5e1" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="352" y="13" font-size="11" fill="#374151">점선 오버레이 = 키보드가 WebView 위에 겹쳐서 얹힘</text>
  </g>

  <!-- ============ MODE 1: adjustResize ============ -->
  <g transform="translate(40,104)">
    <rect x="0" y="-2" width="240" height="26" rx="6" fill="#2563eb"/>
    <text x="120" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">adjustResize ✅ 권장</text>

    <rect x="0" y="34" width="240" height="440" rx="32" fill="#111827"/>
    <clipPath id="clip-m1"><rect x="10" y="46" width="220" height="416" rx="20"/></clipPath>
    <g clip-path="url(#clip-m1)">
      <rect x="10" y="46" width="220" height="416" fill="#ffffff"/>
      <rect x="10" y="46" width="220" height="26" fill="#ffffff"/>
      <circle cx="120" cy="59" r="4" fill="#374151"/>
      <rect x="10" y="72" width="220" height="40" fill="#eef2f7"/>
      <rect x="26" y="86" width="120" height="8" rx="4" fill="#c7d2e0"/>

      <!-- WebView 영역: 실제로 축소되어 140~310 만 사용, 그 아래는 WebView 바깥 -->
      <rect x="10" y="140" width="220" height="170" fill="#eef4ff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="30" y="160" font-size="9" fill="#6b7280">비밀번호</text>
      <rect x="30" y="166" width="180" height="26" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="42" y="184" font-size="12" letter-spacing="2" fill="#374151">•••••</text>
      <text x="30" y="210" font-size="9" fill="#16a34a" font-weight="700">이메일 주소</text>
      <rect x="30" y="216" width="180" height="26" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <text x="42" y="234" font-size="11" fill="#374151">user@email.com</text>

      <!-- seam: 두 영역이 서로 겹치지 않고 이어붙어 있음 -->
      <rect x="10" y="310" width="220" height="3" fill="#ffffff"/>

      <!-- 키보드는 WebView 바깥의 별도 공간 -->
      <rect x="10" y="313" width="220" height="149" fill="#cbd5e1"/>
      <g fill="#94a3b8">
        <rect x="18" y="325" width="20" height="20" rx="4"/><rect x="44" y="325" width="20" height="20" rx="4"/><rect x="70" y="325" width="20" height="20" rx="4"/><rect x="96" y="325" width="20" height="20" rx="4"/><rect x="122" y="325" width="20" height="20" rx="4"/><rect x="148" y="325" width="20" height="20" rx="4"/><rect x="174" y="325" width="20" height="20" rx="4"/><rect x="200" y="325" width="20" height="20" rx="4"/>
        <rect x="18" y="351" width="20" height="20" rx="4"/><rect x="44" y="351" width="20" height="20" rx="4"/><rect x="70" y="351" width="20" height="20" rx="4"/><rect x="96" y="351" width="20" height="20" rx="4"/><rect x="122" y="351" width="20" height="20" rx="4"/><rect x="148" y="351" width="20" height="20" rx="4"/><rect x="174" y="351" width="20" height="20" rx="4"/><rect x="200" y="351" width="20" height="20" rx="4"/>
        <rect x="18" y="377" width="212" height="20" rx="4"/>
      </g>
      <text x="120" y="440" text-anchor="middle" font-size="10" fill="#64748b">(WebView 바깥 · OS가 그림)</text>
    </g>
    <rect x="10" y="46" width="220" height="416" rx="20" fill="none" stroke="#e5e7eb"/>

    <!-- height comparison bar: 순서대로 이어붙는 두 조각 (겹침 없음) -->
    <rect x="10" y="490" width="114" height="16" fill="#2563eb"/>
    <rect x="128" y="490" width="102" height="16" fill="#94a3b8"/>
    <text x="67" y="518" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="700">WebView (축소됨)</text>
    <text x="179" y="518" text-anchor="middle" font-size="9" fill="#6b7280">Keyboard</text>

    <text x="120" y="548" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">WebView 자체가 줄어듦 → 겹침 없음</text>
    <text x="120" y="566" text-anchor="middle" font-size="11" fill="#111827">이메일 입력창도 안전하게 보임</text>
    <text x="120" y="584" text-anchor="middle" font-size="11" fill="#6b7280">innerHeight/dvh/visualViewport 모두 축소 반영</text>
  </g>

  <!-- ============ MODE 2: adjustPan ============ -->
  <g transform="translate(500,104)">
    <rect x="0" y="-2" width="240" height="26" rx="6" fill="#d97706"/>
    <text x="120" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">adjustPan ⚠️ 보정 필요</text>

    <rect x="0" y="34" width="240" height="440" rx="32" fill="#111827"/>
    <clipPath id="clip-m2"><rect x="10" y="46" width="220" height="416" rx="20"/></clipPath>
    <g clip-path="url(#clip-m2)">
      <rect x="10" y="46" width="220" height="416" fill="#ffffff"/>
      <rect x="10" y="46" width="220" height="26" fill="#ffffff"/>
      <circle cx="120" cy="59" r="4" fill="#374151"/>
      <rect x="10" y="72" width="220" height="40" fill="#eef2f7"/>
      <rect x="26" y="86" width="120" height="8" rx="4" fill="#c7d2e0"/>

      <!-- WebView 영역: 축소되지 않고 화면 전체(140~462)를 그대로 유지 -->
      <rect x="10" y="140" width="220" height="322" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <text x="30" y="160" font-size="9" fill="#6b7280">비밀번호</text>
      <rect x="30" y="166" width="180" height="26" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="42" y="184" font-size="12" letter-spacing="2" fill="#374151">•••••</text>
      <text x="30" y="210" font-size="9" fill="#16a34a" font-weight="700">이메일 주소 (pan으로 이동됨)</text>
      <rect x="30" y="216" width="180" height="26" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <text x="42" y="234" font-size="11" fill="#374151">user@email.com</text>

      <!-- 키보드: WebView 크기는 그대로인데, 그 위에 겹쳐서(overlay) 얹힘 -->
      <rect x="10" y="313" width="220" height="149" fill="#cbd5e1"/>
      <rect x="10" y="310" width="220" height="152" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="14" y="304" width="76" height="16" rx="4" fill="#d97706"/>
      <text x="52" y="316" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">OVERLAY</text>
      <g fill="#94a3b8">
        <rect x="18" y="325" width="20" height="20" rx="4"/><rect x="44" y="325" width="20" height="20" rx="4"/><rect x="70" y="325" width="20" height="20" rx="4"/><rect x="96" y="325" width="20" height="20" rx="4"/><rect x="122" y="325" width="20" height="20" rx="4"/><rect x="148" y="325" width="20" height="20" rx="4"/><rect x="174" y="325" width="20" height="20" rx="4"/><rect x="200" y="325" width="20" height="20" rx="4"/>
        <rect x="18" y="351" width="20" height="20" rx="4"/><rect x="44" y="351" width="20" height="20" rx="4"/><rect x="70" y="351" width="20" height="20" rx="4"/><rect x="96" y="351" width="20" height="20" rx="4"/><rect x="122" y="351" width="20" height="20" rx="4"/><rect x="148" y="351" width="20" height="20" rx="4"/><rect x="174" y="351" width="20" height="20" rx="4"/><rect x="200" y="351" width="20" height="20" rx="4"/>
      </g>

      <!-- 이메일의 원래(un-panned) 위치: 키보드 밑에 깔림. 키보드 위에 주석으로 표시 -->
      <rect x="30" y="356" width="180" height="26" rx="8" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="120" y="398" text-anchor="middle" font-size="9" fill="#57534e" font-weight="600">이메일 원래 위치 (키보드 아래)</text>

      <!-- pan으로 실제 escape된 이메일 입력창을 가리키는 화살표 -->
      <line x1="120" y1="352" x2="120" y2="246" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
    </g>
    <rect x="10" y="46" width="220" height="416" rx="20" fill="none" stroke="#e5e7eb"/>

    <!-- height comparison bar: WebView는 100% 그대로 + 우측에 겹치는 오버레이 패치 -->
    <rect x="10" y="490" width="220" height="16" fill="#d97706"/>
    <rect x="128" y="486" width="102" height="24" fill="#cbd5e1" opacity="0.92" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="67" y="518" text-anchor="middle" font-size="9" fill="#d97706" font-weight="700">WebView (그대로, 100%)</text>
    <text x="179" y="518" text-anchor="middle" font-size="9" fill="#92400e">키보드 겹침</text>

    <text x="120" y="548" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">WebView는 안 줄어듦 → 키보드가 위에 겹침</text>
    <text x="120" y="566" text-anchor="middle" font-size="11" fill="#111827">focus된 이메일 입력창만 위로 pan해서 회피</text>
    <text x="120" y="584" text-anchor="middle" font-size="11" fill="#6b7280">innerHeight/dvh 불변, offsetTop만 변함</text>
  </g>

  <!-- ============ MODE 3: adjustNothing ============ -->
  <g transform="translate(960,104)">
    <rect x="0" y="-2" width="240" height="26" rx="6" fill="#dc2626"/>
    <text x="120" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">adjustNothing ❌ 지양</text>

    <rect x="0" y="34" width="240" height="440" rx="32" fill="#111827"/>
    <clipPath id="clip-m3"><rect x="10" y="46" width="220" height="416" rx="20"/></clipPath>
    <g clip-path="url(#clip-m3)">
      <rect x="10" y="46" width="220" height="416" fill="#ffffff"/>
      <rect x="10" y="46" width="220" height="26" fill="#ffffff"/>
      <circle cx="120" cy="59" r="4" fill="#374151"/>
      <rect x="10" y="72" width="220" height="40" fill="#eef2f7"/>
      <rect x="26" y="86" width="120" height="8" rx="4" fill="#c7d2e0"/>

      <!-- WebView 영역: 이 모드도 축소되지 않고 화면 전체를 그대로 유지 -->
      <rect x="10" y="140" width="220" height="322" fill="#fef2f2" stroke="#9ca3af" stroke-width="2.5"/>
      <text x="30" y="160" font-size="9" fill="#6b7280">비밀번호</text>
      <rect x="30" y="166" width="180" height="26" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
      <text x="42" y="184" font-size="12" letter-spacing="2" fill="#374151">•••••</text>
      <text x="30" y="210" font-size="9" fill="#dc2626" font-weight="700">이메일 주소 (그대로 안 움직임)</text>

      <!-- 키보드: WebView 크기는 그대로인데 그 위에 겹쳐서 얹힘, 아무 회피도 없음 -->
      <rect x="10" y="313" width="220" height="149" fill="#cbd5e1"/>
      <rect x="10" y="310" width="220" height="152" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
      <rect x="14" y="304" width="76" height="16" rx="4" fill="#dc2626"/>
      <text x="52" y="316" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">OVERLAY</text>
      <g fill="#94a3b8">
        <rect x="18" y="325" width="20" height="20" rx="4"/><rect x="44" y="325" width="20" height="20" rx="4"/><rect x="70" y="325" width="20" height="20" rx="4"/><rect x="96" y="325" width="20" height="20" rx="4"/><rect x="122" y="325" width="20" height="20" rx="4"/><rect x="148" y="325" width="20" height="20" rx="4"/><rect x="174" y="325" width="20" height="20" rx="4"/><rect x="200" y="325" width="20" height="20" rx="4"/>
        <rect x="18" y="351" width="20" height="20" rx="4"/><rect x="44" y="351" width="20" height="20" rx="4"/><rect x="70" y="351" width="20" height="20" rx="4"/><rect x="96" y="351" width="20" height="20" rx="4"/><rect x="122" y="351" width="20" height="20" rx="4"/><rect x="148" y="351" width="20" height="20" rx="4"/><rect x="174" y="351" width="20" height="20" rx="4"/><rect x="200" y="351" width="20" height="20" rx="4"/>
      </g>

      <!-- 이메일 필드: pan 없이 원래 자리 그대로, 키보드 밑에 파묻힘 -->
      <rect x="30" y="356" width="180" height="26" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
      <text x="42" y="374" font-size="11" fill="#374151" opacity="0.5">user@email.com</text>

      <!-- danger annotation, 맨 위에 그려서 입력창이 가려짐을 강조 -->
      <rect x="26" y="352" width="188" height="34" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
    </g>
    <rect x="10" y="46" width="220" height="416" rx="20" fill="none" stroke="#e5e7eb"/>

    <rect x="10" y="490" width="220" height="16" fill="#9ca3af"/>
    <rect x="128" y="486" width="102" height="24" fill="#cbd5e1" opacity="0.92" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="67" y="518" text-anchor="middle" font-size="9" fill="#6b7280" font-weight="700">WebView (그대로, 100%)</text>
    <text x="179" y="518" text-anchor="middle" font-size="9" fill="#dc2626">키보드 겹침</text>

    <text x="120" y="548" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">WebView도 안 줄고 pan도 없음 → 그냥 덮임</text>
    <text x="120" y="566" text-anchor="middle" font-size="11" fill="#111827">이메일 입력창이 키보드 밑에 그대로 파묻힘</text>
    <text x="120" y="584" text-anchor="middle" font-size="11" fill="#6b7280">visualViewport.resize 이벤트조차 미발화</text>
  </g>

  <defs>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="620" y="720" text-anchor="middle" font-size="12" fill="#111827" font-weight="600">⤷ 근본 해결책: 앱 팀이 windowSoftInputMode="adjustResize" 로 고정 — WebView 자체가 줄어들어야 겹침이 원천적으로 사라집니다</text>
</svg>
